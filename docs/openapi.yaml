openapi: 3.0.3
info:
  title: ShopSphere API Specification
  description: >
    Production-grade multi-seller e-commerce RESTful API compliant with ShopSphere SRS v1.0.
    Features JWT authentication, 2FA (TOTP), multi-seller order splitting, verified purchase reviews,
    immutable audit logging, step-up authorization, and real-time observability telemetry.
  version: 1.0.0
  contact:
    name: ShopSphere Engineering Team
    email: api@shopsphere.example.com
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Environment
  - url: https://api.shopsphere.example.com/api/v1
    description: Production Environment

tags:
  - name: Health & Telemetry
    description: System health, Prometheus scraping, and observability metrics
  - name: Authentication
    description: Registration, login, JWT token rotation, sessions, and 2FA
  - name: Catalog & Products
    description: Product discovery, search, filtering, and detail
  - name: Cart
    description: User and guest shopping cart operations
  - name: Orders & Checkout
    description: Checkout, multi-seller sub-order state machine, and order history
  - name: Seller Dashboard
    description: Merchant onboarding, SKU inventory, analytics, and bulk CSV ingest
  - name: Reviews
    description: Verified purchase reviews, photo attachments, voting, and seller responses
  - name: Administration
    description: Platform governance, user moderation, step-up re-auth, and audit logs

paths:
  /health:
    get:
      tags: [Health & Telemetry]
      summary: Service Health Check
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: "ok" }

  /metrics:
    get:
      tags: [Health & Telemetry]
      summary: Prometheus Scrape Metrics (NFR-PERF-01, Step 4.3.2)
      responses:
        '200':
          description: Plaintext Prometheus metric exposition
          content:
            text/plain:
              schema:
                type: string

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register customer account (AUTH-FR-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Registration successful, verification email dispatched
        '400':
          description: Validation error or email already registered

  /auth/login:
    post:
      tags: [Authentication]
      summary: User Login (AUTH-FR-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful (returns accessToken in body, sets refreshToken in HttpOnly cookie)
        '401':
          description: Invalid credentials
        '403':
          description: Email not verified or account suspended

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh Access Token with Token Rotation (SEC-02)
      responses:
        '200':
          description: Returns new 15m access token and rotates 7d refresh token
        '401':
          description: Token expired, invalid, or reuse detected (revokes family)

  /products:
    get:
      tags: [Catalog & Products]
      summary: Browse & Search Products (CAT-FR-01, 02)
      parameters:
        - name: q
          in: query
          description: Typo-tolerant search keyword
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated product listing with facets

  /cart:
    get:
      tags: [Cart]
      summary: Get active shopping cart (CART-FR-01)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current cart contents and pricing snapshot

  /checkout:
    post:
      tags: [Orders & Checkout]
      summary: Place order from cart (ORD-FR-01, CART-FR-06)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress, idempotencyKey]
              properties:
                shippingAddress:
                  type: object
                  required: [street, city, state, postalCode, country]
                  properties:
                    street: { type: string }
                    city: { type: string }
                    state: { type: string }
                    postalCode: { type: string }
                    country: { type: string }
                idempotencyKey: { type: string }
                paymentMethod: { type: string, default: "stripe" }
      responses:
        '201':
          description: Order successfully created and split into subOrders by seller

  /seller/analytics:
    get:
      tags: [Seller Dashboard]
      summary: Seller Sales Analytics (SELL-FR-04)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Revenue breakdown, top products, and fulfillment status

  /admin/users/{id}/suspend:
    post:
      tags: [Administration]
      summary: Suspend user account with Step-Up Re-Auth (ADM-FR-01, SEC-06, SEC-21)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: x-step-up-token
          in: header
          required: true
          description: 5-minute elevated action token
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: User suspended and audit log recorded
        '403':
          description: Step-up token missing/invalid or attempt to suspend super_admin

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
